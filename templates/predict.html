{% extends "base.html" %}
{% block content %}
<div class="container py-5">
<div class="page-head"><div><span class="eyebrow">PREDICTION ENGINE</span><h1>Student Placement Prediction</h1><p>Enter the student's profile to generate a real ML-based prediction.</p></div></div>
<form method="post" class="content-card">
<h4 class="mb-4">Student Profile</h4>
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Student Name</label><input class="form-control" name="student_name" type="text" value="Harshil Gediya" required></div><div class="col-md-6"><label class="form-label">Age</label><input class="form-control" name="age" type="number" value="21" required></div><div class="col-md-6"><label class="form-label">10th Percentage</label><input class="form-control" name="tenth_percentage" type="number" value="85" required></div><div class="col-md-6"><label class="form-label">12th Percentage</label><input class="form-control" name="twelfth_percentage" type="number" value="82" required></div><div class="col-md-6"><label class="form-label">CGPA</label><input class="form-control" name="cgpa" type="number" value="8.2" required></div><div class="col-md-6"><label class="form-label">Backlogs</label><input class="form-control" name="backlogs" type="number" value="0" required></div><div class="col-md-6"><label class="form-label">Attendance %</label><input class="form-control" name="attendance_percentage" type="number" value="85" required></div><div class="col-md-6"><label class="form-label">Internship Months</label><input class="form-control" name="internship_months" type="number" value="6" required></div><div class="col-md-6"><label class="form-label">Projects</label><input class="form-control" name="projects" type="number" value="3" required></div><div class="col-md-6"><label class="form-label">Certifications</label><input class="form-control" name="certifications" type="number" value="2" required></div><div class="col-md-6"><label class="form-label">Coding Skill (1-10)</label><input class="form-control" name="coding_skill" type="number" value="8" required></div><div class="col-md-6"><label class="form-label">Communication Skill (1-10)</label><input class="form-control" name="communication_skill" type="number" value="8" required></div><div class="col-md-6"><label class="form-label">Aptitude Score</label><input class="form-control" name="aptitude_score" type="number" value="82" required></div><div class="col-md-6"><label class="form-label">Technical Skill (1-10)</label><input class="form-control" name="technical_skill" type="number" value="8" required></div>
<div class="col-md-6"><label class="form-label">Gender</label><select class="form-select" name="gender"><option>Male</option><option>Female</option></select></div>
<div class="col-md-6"><label class="form-label">Branch</label><select class="form-select" name="branch"><option>Computer Engineering</option><option>Information Technology</option><option>Mechanical Engineering</option><option>Civil Engineering</option><option>Electrical Engineering</option><option>Electronics Engineering</option></select></div>
<div class="col-md-6"><label class="form-label">College Tier</label><select class="form-select" name="college_tier"><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option></select></div>
<div class="col-md-6"><label class="form-label">City</label><select class="form-select" name="city"><option>Surat</option><option>Ahmedabad</option><option>Vadodara</option><option>Rajkot</option><option>Mumbai</option><option>Pune</option><option>Bangalore</option><option>Delhi</option><option>Hyderabad</option><option>Chennai</option></select></div>
<div class="col-md-6"><label class="form-label">Internship</label><select class="form-select" name="internship"><option>Yes</option><option>No</option></select></div>
<div class="col-md-6"><label class="form-label">Hackathon Participation</label><select class="form-select" name="hackathon_participation"><option>Yes</option><option>No</option></select></div>
<div class="col-md-6"><label class="form-label">Extracurricular</label><select class="form-select" name="extracurricular"><option>Yes</option><option>No</option></select></div>
<div class="col-md-6"><label class="form-label">Preferred Domain</label><select class="form-select" name="preferred_domain"><option>Software Development</option><option>Data Science</option><option>Web Development</option><option>Testing</option><option>Cloud Computing</option><option>Networking</option></select></div>
</div>
<div class="mt-4 pt-3 border-top"><button class="btn btn-primary btn-lg px-5">Run AI Prediction →</button></div>
</form>
</div>
{% endblock %}
